name: kaeru

services:
  pd:
    image: pingcap/pd:v8.5.8@sha256:424e896800e42e1b7eb585b604c8daa3454110d0f0df5ab41f7c5f49164d3aef
    command:
      - --name=pd
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --config=/etc/pd/pd.toml
    volumes:
      - pd_data:/data
      - ./docker/pd.toml:/etc/pd/pd.toml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:2379/health | grep -Eq '"health"[[:space:]]*:[[:space:]]*"true"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    cpus: 1
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
    stop_grace_period: 30s
    restart: unless-stopped

  tikv:
    image: pingcap/tikv:v8.5.8@sha256:ab84580b6795868940231aa778a34b082d19e4417e6d66f755c609bebdbbfd69
    depends_on:
      pd:
        condition: service_healthy
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --pd-endpoints=pd:2379
      - --data-dir=/data
      - --config=/etc/tikv/tikv.toml
    volumes:
      - tikv_data:/data
      - ./docker/tikv.toml:/etc/tikv/tikv.toml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:20180/status && curl -fsS http://pd:2379/pd/api/v1/stores | grep -Eq '"state_name"[[:space:]]*:[[:space:]]*"Up"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    cpus: 2
    mem_limit: 3g
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
    stop_grace_period: 30s
    restart: unless-stopped

  # Default central stack: all three services share one Compose network.
  memory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.memory-service
    environment:
      KAERU_MEMORY_LISTEN_ADDRESS: "0.0.0.0"
      KAERU_MEMORY_ALLOWED_HOSTS: "${KAERU_MEMORY_ALLOWED_HOSTS:-}"
      KAERU_MEMORY_API_ALLOW: "${KAERU_MEMORY_API_ALLOW:-}"
      KAERU_MEMORY_API_DENY: "${KAERU_MEMORY_API_DENY:-}"
      KAERU_MEMORY_API_INCLUDE_LOCAL: "${KAERU_MEMORY_API_INCLUDE_LOCAL:-false}"
      KAERU_MEMORY_HYGIENE_ENABLE: "${KAERU_MEMORY_HYGIENE_ENABLE:-true}"
      KAERU_MEMORY_API_TOKEN: "${KAERU_MEMORY_API_TOKEN:-${KAERU_CLOUD_API_TOKEN:-}}"
      KAERU_STORAGE__BACKEND: "tikv"
      KAERU_STORAGE__END_POINTS: "pd:2379"
      KAERU_STORAGE__NAMESPACE: "${KAERU_STORAGE__NAMESPACE:-memory}"
      RUST_LOG: "${RUST_LOG:-info}"
    depends_on:
      tikv:
        condition: service_healthy
    stop_grace_period: 20s
    # Retain the former cloud volume for artifacts or explicit operator-led
    # migration. The service never opens it as a fallback for missing TiKV.
    volumes:
      - memory_data:/home/kaeru/.local/share/kaeru
    ports:
      - "${KAERU_MEMORY_PORT:-9877}:9877"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9877' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional private local memory host; the installed command stays kaeru-mcp.
  kaeru-local:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    environment:
      KAERU_MCP_LISTEN_ADDRESS: "0.0.0.0"
      KAERU_STORAGE__BACKEND: "rocksdb"
      KAERU_MCP_CLOUD_URL: ""
      KAERU_MCP_CLOUD_TOKEN: ""
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - kaeru_data:/home/kaeru/.local/share/kaeru
    ports:
      - "127.0.0.1:${KAERU_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tokenizer-db:
    profiles: [tokenizer]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tokenizer
      POSTGRES_DB: tokenizer
      POSTGRES_PASSWORD: "${TOKENIZER_DB_PASSWORD:-}"
    volumes:
      - tokenizer_pg_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tokenizer -d tokenizer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tokenizer-valkey:
    profiles: [tokenizer]
    image: valkey/valkey:8.1-alpine
    command: [valkey-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - tokenizer_valkey_data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tokenizer-service:
    profiles: [tokenizer]
    build:
      context: .
      dockerfile: docker/Dockerfile.tokenizer
    environment:
      TOKENIZER_LISTEN: "0.0.0.0:9880"
      TOKENIZER_DATABASE_URL: "postgres://tokenizer:${TOKENIZER_DB_PASSWORD:-}@tokenizer-db:5432/tokenizer"
      TOKENIZER_VALKEY_URL: "redis://tokenizer-valkey:6379"
      TOKENIZER_CONTROL_KEY: "${TOKENIZER_CONTROL_KEY:-}"
      TOKENIZER_MEMORY_KEY: "${TOKENIZER_MEMORY_KEY:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    depends_on:
      tokenizer-db:
        condition: service_healthy
      tokenizer-valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TOKENIZER_PORT:-9880}:9880"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9880/health/live]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  pd_data:
  tikv_data:
  kaeru_data:
    driver: local
    name: kaeru-data
  memory_data:
    driver: local
    name: kaeru-cloud-data
  tokenizer_pg_data:
  tokenizer_valkey_data:
