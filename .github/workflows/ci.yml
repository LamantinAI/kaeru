name: ci

# The container build only runs on pushes to main and tags, so until now
# nothing verified a pull request: `cargo test` existed but ran only where a
# developer remembered to type it. This workflow makes the suite the gate.

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-tokenizer:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tokenizer
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tokenizer"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TOKENIZER_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-password@127.0.0.1:5432/tokenizer
      TOKENIZER_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Test isolated authorization and HTTP/2 contracts
        run: cargo test --locked -p contracts -p kaeru-tokenizer-service --all-targets -- --include-ignored

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kaeru-viz/package-lock.json
      - run: npm ci
        working-directory: kaeru-viz
      - run: npm test
        working-directory: kaeru-viz
      - run: npm run check:embedded
        working-directory: kaeru-viz

  test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n contrib/install/install.sh
      - run: python3 -m unittest discover -s contrib/install -p 'test_*.py' -v

  test-update-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test transactional update counting
        run: node --test contrib/update-worker/test/counter.test.mjs

  test:
    # Keep Playwright's system dependencies on a supported runner image.
    runs-on: ubuntu-24.04
    env:
      # Bundled RocksDB headers rely on an indirect <cstdint> include removed
      # by newer libstdc++. Supply it explicitly when compiling C++ in CI.
      CXXFLAGS: "-include cstdint"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting is already clean across the workspace, so this is a cheap
      # gate. Note rustfmt.toml asks for two nightly-only options; on stable
      # they are ignored with a warning, which is expected and harmless.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kaeru-viz/package-lock.json
      - name: Build MCP for browser integration tests
        run: cargo build -p kaeru-local --locked
      - name: Test embedded UI against a temporary MCP instance
        working-directory: kaeru-viz
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
