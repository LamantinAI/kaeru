name: hook-tests

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  test-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test hooks and offline judge evaluation
        run: python3 -m unittest discover -s contrib/hooks/kaeru-first -p 'test_*.py' -v
