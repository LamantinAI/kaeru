<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kaeru — a knowledge galaxy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/fonts.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="graph"></div>

    <!-- the reader: the same graph, read instead of surveyed -->
    <section id="reader" hidden>
      <div id="rcanvas"><div id="rworld"><svg id="rtrack"></svg></div></div>
      <div id="manuscript"></div>
      <header id="rbar">
        <button id="rPrev" class="btn" hidden>← back</button>
        <button id="rBack" class="btn">galaxy</button>
        <div class="rtitle"><span class="rkind">reasoning chain</span><b id="rname">—</b></div>
        <div class="themeseg" id="rView" role="group" aria-label="reader view">
          <button type="button" id="rTrail" class="on">map</button>
          <button type="button" id="rMs">read</button>
        </div>
      </header>
      <div id="rhint">click a step to read it</div>
    </section>

    <!-- the board: the same tasks, owed instead of surveyed -->
    <section id="board" hidden>
      <header id="bbar">
        <button id="bBack" class="btn">galaxy</button>
        <div class="rtitle"><span class="rkind">task board</span><b id="bname">—</b></div>
        <div class="field bpick">
          <label for="bInit">initiative</label>
          <select id="bInit" class="ctl"></select>
        </div>
      </header>
      <div id="bfilter">
        <label class="sr-only" for="bFind">Filter cards by text</label>
        <input id="bFind" type="search" placeholder="filter cards…" autocomplete="off" spellcheck="false" />
        <div id="bsieves" role="group" aria-label="Quick filters"></div>
        <button id="bClear" class="btn" hidden>clear</button>
      </div>
      <a class="skip" href="#bend">Skip the cards</a>
      <div id="bcols"></div>
      <span id="bend" tabindex="-1"></span>
      <p id="bcount"></p>
      <!-- the card, over the board rather than squeezing it (Jira's drawer) -->
      <aside id="bdetail" aria-labelledby="bdhead" hidden></aside>
      <p id="bsay" class="sr-only" role="status" aria-live="polite"></p>
    </section>

    <header id="hud">
      <div class="seal" title="蛙 — kaeru, &quot;frog&quot;">蛙</div>
      <div class="wordmark">
        <h1>kaeru</h1>
        <span class="sub">memory of record · across agents</span>
      </div>
      <div id="stats" class="stats">loading…</div>
    </header>

    <section id="panel">
      <div class="seg">
        <div class="field">
          <label for="chainPick">reasoning chain</label>
          <select id="chainPick" class="ctl"></select>
        </div>
        <button id="chainPlay" class="btn go">replay</button>
        <button id="chainRead" class="btn">read</button>
        <button id="chainReset" class="btn">reset</button>
      </div>
      <div class="seg">
        <div class="field">
          <label for="colorMode">colour by</label>
          <select id="colorMode" class="ctl">
            <option value="initiative">initiative</option>
            <option value="tier">tier · hippocampus / cortex</option>
            <option value="layer">layer · importance</option>
          </select>
        </div>
        <label class="toggle"><input type="checkbox" id="glow" checked /><span class="box"></span>layer glow</label>
      </div>
      <div class="seg">
        <div class="field">
          <label for="focus">focus</label>
          <select id="focus" class="ctl"><option value="">all projects</option></select>
        </div>
        <button id="boardBtn" class="btn">board</button>
        <button id="talkBtn" class="btn" aria-label="Guided tour">tour</button>
      </div>
      <div class="seg">
        <div class="field">
          <label>theme</label>
          <div class="themeseg" id="themeSeg" role="group" aria-label="theme">
            <button type="button" data-t="auto">auto</button>
            <button type="button" data-t="light">light</button>
            <button type="button" data-t="dark">dark</button>
          </div>
        </div>
      </div>
      <div class="seg scrub">
        <div class="field" style="flex: 1">
          <label for="time">time-lapse</label>
          <div class="trackrow">
            <input type="range" id="time" min="0" max="100" value="100" />
            <button id="timePlay" class="btn mini" aria-label="play time-lapse"></button>
            <span id="timeLabel" class="val">— full graph —</span>
          </div>
        </div>
      </div>
    </section>

    <aside id="readout"></aside>

    <!-- right rail: find a node by name, or narrow the galaxy to one project -->
    <aside id="rail">
      <div id="find">
        <label class="sr-only" for="findInput">Find a node by name</label>
        <input id="findInput" type="search" placeholder="find a node…" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="findHits"
               aria-autocomplete="list" aria-haspopup="listbox" />
        <div id="findHits" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <p id="findStatus" class="sr-only" role="status" aria-live="polite"></p>
      <div id="projects" role="group" aria-label="Projects"></div>
      <div id="legend"></div>
    </aside>

    <section id="script" hidden>
      <div class="scriptcard">
        <div class="scriptmeta">
          <span id="scriptTag" class="tag"></span>
          <span id="scriptNum" class="num"></span>
        </div>
        <h2 id="scriptTitle"></h2>
        <p id="scriptNarr"></p>
        <div class="scriptnav">
          <button id="scriptPrev" class="btn">← back</button>
          <span id="scriptDots" class="dots"></span>
          <button id="scriptNext" class="btn go">next →</button>
          <button id="scriptExit" class="btn">exit</button>
        </div>
      </div>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
